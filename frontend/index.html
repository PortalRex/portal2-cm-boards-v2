<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit=cover: on iPhones the page runs under Safari's bars (they showed grey otherwise). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1f21" />
    <!-- The site has its own dark theme; Dark Reader would recolour it and drop the panels' backgrounds. -->
    <meta name="darkreader-lock" />
    <!-- Applies the saved theme before first paint (a file, not inline, so the CSP can forbid inline scripts). -->
    <script src="/theme.js"></script>
    <meta name="description" content="Portal 2 Challenge Mode leaderboards" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Portal 2 Boards</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
