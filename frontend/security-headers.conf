# Security headers for the site's pages (the API sets its own). Included in every location that
# has its own add_header, since add_header in a location replaces the inherited ones.
#
# Content-Security-Policy, what the site loads:
#   script-src  'self'            the built bundle and theme.js (no inline scripts: the build runs
#                                 with INLINE_RUNTIME_CHUNK=false)
#   style-src   'self' 'unsafe-inline' fonts.googleapis.com   MUI/emotion and recharts write inline styles
#   font-src    fonts.gstatic.com data:
#   img-src     https: data:      Steam avatars, flag images, map images, autorender thumbnails
#   media-src   https:            autorender videos (object storage and autorender.portal2.sr)
#   frame-src   youtube-nocookie.com
#   connect-src 'self' autorender.portal2.sr   the API (same origin) and autorender's "which videos exist" check
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:; media-src 'self' https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://autorender.portal2.sr; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS only when the request reached us over https (set by the TLS terminator in front); an
# empty value means the header isn't sent.
add_header Strict-Transport-Security $p2cm_hsts always;
