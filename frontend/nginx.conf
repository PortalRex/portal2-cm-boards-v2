# HSTS is sent only for requests that came in over https (X-Forwarded-Proto from the TLS
# terminator in front, or a direct https listener).
map $http_x_forwarded_proto $p2cm_hsts {
    https "max-age=31536000; includeSubDomains";
    default "";
}

# Link-preview bots (Discord, Slack, Twitter, ...) don't run the app, so for a page they get its
# title, description and image from the server instead. Search engines aren't on the list: they get
# the app like everyone else.
map $http_user_agent $p2cm_preview_bot {
    default 0;
    "~*(discordbot|twitterbot|facebookexternalhit|facebot|slackbot|telegrambot|whatsapp|linkedinbot|embedly|redditbot|skypeuripreview|mastodon|bluesky|cardyb|iframely)" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Behind a reverse proxy on a private network (Coolify's Traefik), the connection comes from the proxy:
    # take the visitor's address from the X-Forwarded-For it sends instead, so rate limits see each visitor.
    # Only private addresses are trusted, and the rightmost untrusted entry is used, so a visitor can't pick
    # their address by sending the header themselves (the proxy appends theirs after it).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Demo uploads are up to 50 MB.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        # Steam sign-in compares the host the browser used (host:port) with SERVER.PUBLIC_URL.
        proxy_set_header Host $http_host;
        # The page a link preview is for (the request before the rewrite below).
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replaced, not appended to, so clients can't pick the address rate limits see.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The client's own Forwarded header would let them pick their address; the server reads X-Forwarded-For.
        proxy_set_header Forwarded "";
        # The staff inbox long-polls for 25 s.
        proxy_read_timeout 120s;
    }

    # SAR's auto-submit, at the old boards' address (/api-v2/...): the same server. Demos are up to 50 MB.
    location /api-v2/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The client's own Forwarded header would let them pick their address; the server reads X-Forwarded-For.
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;
    }

    # Built files have content hashes in their names.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The demo viewer, where it's built in (frontend/public/viewer: see README.md), with its own
    # security headers. Without it, /viewer/ is a 404.
    location /viewer/ {
        include /etc/nginx/snippets/viewer-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location /viewer/assets/ {
        include /etc/nginx/snippets/viewer-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes: every other path is the app.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # A link-preview bot asking for a page gets the server's preview of it; files (the share
        # image, icons) are served to it as they are.
        set $p2cm_preview $p2cm_preview_bot;
        if (-f $request_filename) {
            set $p2cm_preview 0;
        }
        if ($p2cm_preview) {
            rewrite ^ /api/v1/link_preview last;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
