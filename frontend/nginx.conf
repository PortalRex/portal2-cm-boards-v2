# HSTS is sent only for requests that came in over https (X-Forwarded-Proto from the TLS
# terminator in front, or a direct https listener).
map $http_x_forwarded_proto $p2cm_hsts {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Behind a reverse proxy on a private network (Coolify's Traefik), the connection comes from the proxy:
    # take the visitor's address from the X-Forwarded-For it sends instead, so rate limits see each visitor.
    # Only private addresses are trusted, and the rightmost untrusted entry is used, so a visitor can't pick
    # their address by sending the header themselves (the proxy appends theirs after it).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Demo uploads are up to 50 MB.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        # Steam sign-in compares the host the browser used (host:port) with SERVER.PUBLIC_URL.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replaced, not appended to, so clients can't pick the address rate limits see.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The staff inbox long-polls for 25 s.
        proxy_read_timeout 120s;
    }

    # SAR's auto-submit, at the old boards' address (/api-v2/...): the same server. Demos are up to 50 MB.
    location /api-v2/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # Built files have content hashes in their names.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes: every other path is the app.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
