server {
    listen 80;
    root /usr/share/nginx/html;

    # Demo uploads are up to 50 MB.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        # Steam sign-in compares the host the browser used (host:port) with SERVER.PUBLIC_URL.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replaced, not appended to, so clients can't pick the address rate limits see.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The staff inbox long-polls for 25 s.
        proxy_read_timeout 120s;
    }

    # Built files have content hashes in their names.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes: every other path is the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
