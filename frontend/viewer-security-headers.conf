# Security headers for the demo viewer (/viewer/), in place of security-headers.conf there: the
# viewer loads the same kinds of things from this site only, but also
#   worker-src  'self' blob:     its map and model readers run in workers
#   img-src     blob:            textures made from the game's files in the page
#   media-src   blob:            exported videos previewed in the page
#   font-src    blob:            the game's own fonts, read from the visitor's game folder
# The visitor's Portal 2 files are read in the page (folder picker) and never fetched. The site's own
# pages show it in a frame (replays), so it may be framed by this site only (frame-ancestors 'self',
# X-Frame-Options SAMEORIGIN).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $p2cm_hsts always;
