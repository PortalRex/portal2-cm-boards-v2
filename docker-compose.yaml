# The whole board in Docker: Postgres, the Rust web server and the site (nginx), at http://localhost:3000.
# Settings are read from server/.env (copy server/.env.example); the values under `server.environment`
# below are fixed for this setup and override it. See "Docker" in README.md.
name: p2boards

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: p2boards
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the tables when the volume is empty (first start only).
      - ./db/dbscript/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d p2boards"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://docker:docker@db:5432/p2boards
      SERVER.HOST: 0.0.0.0
      SERVER.PORT: "8080"
      # Only nginx (web) can reach the server, so the client address comes from X-Forwarded-For.
      SERVER.BEHIND_PROXY: "true"
      DEMO.PARSER: ./demo-parser/parse_demo.mjs
      DEMO.STORAGE: /data/demos
      IMAGES.STORAGE: /data/map-images
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    # Keep SERVER.PUBLIC_URL in server/.env in step if you change the port.
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - server

volumes:
  pgdata:
  # Submitted demos and map images.
  uploads:
